<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Aurora Reel: Vista-style aurora ribbons in blue and violet, with a glass
       film reel turning in the lower right -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a3d"/>
      <stop offset="0.5" stop-color="#14306e"/>
      <stop offset="1" stop-color="#2a1d5e"/>
    </linearGradient>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd6ff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#3fd6ff" stop-opacity="0.8"/>
      <stop offset="0.7" stop-color="#7a8bff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#b06bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b6bff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#9b6bff" stop-opacity="0.6"/>
      <stop offset="0.8" stop-color="#46e0d0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#46e0d0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e6f4ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="reelGlass" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#a9c9ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#a9c9ff" stop-opacity="0.22"/>
    </radialGradient>
    <linearGradient id="reelShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="glowSm" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <!-- Reel: a disc with five round windows punched out, plus the hub -->
    <mask id="reelHoles">
      <rect x="-300" y="-300" width="600" height="600" fill="#fff"/>
      <g fill="#000">
        <circle cy="-150" r="72"/>
        <circle cy="-150" r="72" transform="rotate(72)"/>
        <circle cy="-150" r="72" transform="rotate(144)"/>
        <circle cy="-150" r="72" transform="rotate(216)"/>
        <circle cy="-150" r="72" transform="rotate(288)"/>
        <circle r="26"/>
      </g>
    </mask>
  </defs>

  <rect width="1920" height="1080" fill="url(#night)"/>

  <!-- Aurora ribbons: wide blurred glow, then a crisp bright edge -->
  <g fill="none" stroke-linecap="round">
    <path d="M-100 420 C 300 200, 700 520, 1100 300 S 1700 120, 2020 260"
          stroke="url(#ribbonA)" stroke-width="160" filter="url(#glow)" opacity="0.8"/>
    <path d="M-100 440 C 300 220, 700 540, 1100 320 S 1700 140, 2020 280"
          stroke="url(#ribbonA)" stroke-width="18" filter="url(#glowSm)"/>
    <path d="M-100 620 C 400 460, 800 760, 1250 560 S 1750 420, 2020 500"
          stroke="url(#ribbonB)" stroke-width="140" filter="url(#glow)" opacity="0.7"/>
    <path d="M-100 640 C 400 480, 800 780, 1250 580 S 1750 440, 2020 520"
          stroke="url(#ribbonB)" stroke-width="12" filter="url(#glowSm)"/>
    <path d="M-100 445 C 300 225, 700 545, 1100 325 S 1700 145, 2020 285"
          stroke="url(#ribbonC)" stroke-width="2"/>
    <path d="M-100 645 C 400 485, 800 785, 1250 585 S 1750 445, 2020 525"
          stroke="url(#ribbonC)" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="140" cy="90" r="1.6" opacity="0.8"/>
    <circle cx="380" cy="150" r="1.2" opacity="0.6"/>
    <circle cx="610" cy="70" r="1.8" opacity="0.8"/>
    <circle cx="840" cy="130" r="1.1" opacity="0.6"/>
    <circle cx="1020" cy="60" r="1.5" opacity="0.7"/>
    <circle cx="1290" cy="110" r="1.3" opacity="0.7"/>
    <circle cx="1480" cy="50" r="1.8" opacity="0.8"/>
    <circle cx="1760" cy="90" r="1.2" opacity="0.6"/>
    <circle cx="230" cy="860" r="1.4" opacity="0.5"/>
    <circle cx="560" cy="950" r="1.2" opacity="0.5"/>
    <circle cx="900" cy="880" r="1.6" opacity="0.5"/>
    <circle cx="1150" cy="1000" r="1.2" opacity="0.4"/>
  </g>

  <!-- Glass film reel -->
  <g transform="translate(1540 800) rotate(14)">
    <circle r="250" fill="#6fa8ff" opacity="0.18" filter="url(#glowSm)"/>
    <g mask="url(#reelHoles)">
      <circle r="230" fill="url(#reelGlass)"/>
      <circle r="230" fill="none" stroke="#dbeaff" stroke-opacity="0.6" stroke-width="3"/>
      <circle r="212" fill="none" stroke="#dbeaff" stroke-opacity="0.25" stroke-width="2"/>
      <path d="M-200 -110 A 230 230 0 0 1 200 -110 Q 0 -40 -200 -110 Z" fill="url(#reelShine)"/>
    </g>
    <g fill="none" stroke="#dbeaff" stroke-opacity="0.45" stroke-width="2">
      <circle cy="-150" r="72"/>
      <circle cy="-150" r="72" transform="rotate(72)"/>
      <circle cy="-150" r="72" transform="rotate(144)"/>
      <circle cy="-150" r="72" transform="rotate(216)"/>
      <circle cy="-150" r="72" transform="rotate(288)"/>
      <circle r="26"/>
    </g>
  </g>
</svg>
