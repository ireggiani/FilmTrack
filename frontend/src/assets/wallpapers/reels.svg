<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Reel Grid tile: a glass film reel in each cell of a faint grid on pale
       Aero blue. The grid line sits on the tile's top and left edges. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3eef9"/>
      <stop offset="1" stop-color="#d4e4f4"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#b9d4f0"/>
      <stop offset="1" stop-color="#8fb5de"/>
    </radialGradient>
    <mask id="holes">
      <rect x="-60" y="-60" width="120" height="120" fill="#fff"/>
      <g fill="#000">
        <circle cy="-17" r="8"/>
        <circle cy="-17" r="8" transform="rotate(72)"/>
        <circle cy="-17" r="8" transform="rotate(144)"/>
        <circle cy="-17" r="8" transform="rotate(216)"/>
        <circle cy="-17" r="8" transform="rotate(288)"/>
        <circle r="3"/>
      </g>
    </mask>
  </defs>

  <rect width="120" height="120" fill="url(#ground)"/>
  <rect width="120" height="1" fill="#9db8d6" fill-opacity="0.6"/>
  <rect width="1" height="120" fill="#9db8d6" fill-opacity="0.6"/>
  <rect y="1" width="120" height="1" fill="#fff" fill-opacity="0.8"/>
  <rect x="1" width="1" height="120" fill="#fff" fill-opacity="0.8"/>

  <g transform="translate(60 61)">
    <circle r="30" cy="3" fill="#4a6f9a" fill-opacity="0.18"/>
    <g mask="url(#holes)">
      <circle r="28" fill="url(#glass)" stroke="#6c93c2" stroke-width="1.2"/>
      <path d="M-24 -12 A 28 28 0 0 1 24 -12 Q 0 -4 -24 -12 Z" fill="#fff" fill-opacity="0.6"/>
    </g>
    <g fill="none" stroke="#6c93c2" stroke-width="1" stroke-opacity="0.8">
      <circle cy="-17" r="8"/>
      <circle cy="-17" r="8" transform="rotate(72)"/>
      <circle cy="-17" r="8" transform="rotate(144)"/>
      <circle cy="-17" r="8" transform="rotate(216)"/>
      <circle cy="-17" r="8" transform="rotate(288)"/>
    </g>
  </g>
</svg>
