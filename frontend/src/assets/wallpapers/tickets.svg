<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Ticket Stubs tile: glossy admit-one tickets on cinema red.
       Nothing crosses the tile edges, so tiles join seamlessly. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e2"/>
      <stop offset="0.5" stop-color="#fbe7b0"/>
      <stop offset="0.51" stop-color="#f3d68e"/>
      <stop offset="1" stop-color="#f8e4a8"/>
    </linearGradient>
    <!-- Ticket outline with half-circle notches on the short sides -->
    <path id="ticketShape" d="M-44 -22 H 44 V -7 A 7 7 0 0 0 44 7 V 22 H -44 V 7 A 7 7 0 0 0 -44 -7 Z"/>
    <g id="ticket">
      <use href="#ticketShape" fill="url(#paper)" stroke="#b5862c" stroke-width="1"/>
      <path d="M-40 -18 H 40 V -2 Q 0 4 -40 -2 Z" fill="#fff" fill-opacity="0.45"/>
      <line x1="22" y1="-18" x2="22" y2="18" stroke="#b5862c" stroke-width="1" stroke-dasharray="3 3"/>
      <rect x="-36" y="-14" width="52" height="28" rx="2" fill="none" stroke="#c0392b" stroke-opacity="0.55" stroke-width="1"/>
      <text x="-10" y="-1" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#a3281e" letter-spacing="0.6">ADMIT</text>
      <text x="-10" y="9" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#a3281e" letter-spacing="0.6">ONE</text>
      <text x="33" y="3" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#a3281e" transform="rotate(-90 33 0)">No 24</text>
    </g>
  </defs>

  <rect width="240" height="240" fill="#7d1b26"/>
  <g fill="#000" fill-opacity="0.18">
    <use href="#ticketShape" transform="translate(66 64) rotate(-14)"/>
    <use href="#ticketShape" transform="translate(178 172) rotate(12)"/>
  </g>
  <use href="#ticket" transform="translate(62 58) rotate(-14)"/>
  <use href="#ticket" transform="translate(174 166) rotate(12)"/>
  <g fill="#ffd98a">
    <circle cx="190" cy="50" r="2" fill-opacity="0.5"/>
    <circle cx="40" cy="190" r="2" fill-opacity="0.5"/>
    <circle cx="120" cy="116" r="1.5" fill-opacity="0.4"/>
  </g>
</svg>
