<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Projector Beam: a deep blue theatre, the projector's light cone sweeping
       across with dust caught in it, landing as a glow on the far right -->
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#061633"/>
      <stop offset="0.55" stop-color="#0d2f66"/>
      <stop offset="1" stop-color="#1b5a9c"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="0.93" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#cfe9ff" stop-opacity="0.75"/>
      <stop offset="0.3" stop-color="#7cc4ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="source" cx="0.06" cy="0.14" r="0.12">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#d8efff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d8efff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0.05" y1="0.12" x2="1" y2="0.45">
      <stop offset="0" stop-color="#e6f5ff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#bfe2ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#bfe2ff" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="beamCore" x1="0.05" y1="0.12" x2="1" y2="0.45">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="floorGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd4ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#9fd4ff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bfe6ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="beamBlur" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="blurSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#room)"/>
  <rect width="1920" height="1080" fill="url(#screenGlow)"/>

  <!-- Light cone from the projector port to the screen -->
  <path d="M110 150 L 1980 -60 L 1980 1000 Z" fill="url(#beam)" filter="url(#beamBlur)"/>
  <path d="M110 150 L 1980 160 L 1980 660 Z" fill="url(#beamCore)" filter="url(#blur)" opacity="0.8"/>
  <rect width="1920" height="1080" fill="url(#source)"/>

  <!-- Dust motes drifting in the beam -->
  <g fill="#fff" filter="url(#blurSm)">
    <circle cx="420" cy="210" r="4" opacity="0.7"/>
    <circle cx="560" cy="300" r="3" opacity="0.6"/>
    <circle cx="700" cy="180" r="5" opacity="0.5"/>
    <circle cx="820" cy="390" r="3" opacity="0.6"/>
    <circle cx="960" cy="260" r="6" opacity="0.45"/>
    <circle cx="1080" cy="470" r="4" opacity="0.5"/>
    <circle cx="1180" cy="200" r="3" opacity="0.6"/>
    <circle cx="1300" cy="560" r="5" opacity="0.45"/>
    <circle cx="1420" cy="330" r="4" opacity="0.55"/>
    <circle cx="1530" cy="120" r="3" opacity="0.5"/>
    <circle cx="1620" cy="640" r="6" opacity="0.4"/>
    <circle cx="1720" cy="420" r="4" opacity="0.5"/>
    <circle cx="640" cy="420" r="2" opacity="0.5"/>
    <circle cx="1240" cy="350" r="2" opacity="0.6"/>
    <circle cx="1500" cy="480" r="2" opacity="0.6"/>
  </g>
  <g fill="#e8f6ff">
    <circle cx="500" cy="250" r="1.6" opacity="0.8"/>
    <circle cx="880" cy="300" r="1.4" opacity="0.8"/>
    <circle cx="1010" cy="380" r="1.8" opacity="0.7"/>
    <circle cx="1360" cy="250" r="1.5" opacity="0.8"/>
    <circle cx="1580" cy="560" r="1.6" opacity="0.7"/>
    <circle cx="760" cy="250" r="1.2" opacity="0.8"/>
  </g>

  <!-- Glossy floor and seat-row swooshes -->
  <rect y="760" width="1920" height="320" fill="url(#floorGloss)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M-80 900 C 500 800, 1200 840, 2000 760" stroke="url(#swoosh)" stroke-width="70" opacity="0.35" filter="url(#blur)"/>
    <path d="M-80 930 C 500 830, 1200 870, 2000 790" stroke="url(#swoosh)" stroke-width="2"/>
    <path d="M-80 1010 C 600 930, 1300 960, 2000 900" stroke="url(#swoosh)" stroke-width="1.5" opacity="0.7"/>
  </g>
</svg>
