<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Sprocket Weave tile: two film strips crossing, woven over a teal ground.
       Everything that touches an edge repeats every 20px, so tiles join seamlessly. -->
  <defs>
    <linearGradient id="frameH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8fff4" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e8fff4" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="frameV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8fff4" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e8fff4" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="holesH" width="20" height="8" patternUnits="userSpaceOnUse">
      <rect x="6" y="1" width="8" height="6" rx="1.5" fill="#fff" fill-opacity="0.6"/>
    </pattern>
    <pattern id="holesV" width="8" height="20" patternUnits="userSpaceOnUse">
      <rect x="1" y="6" width="6" height="8" rx="1.5" fill="#fff" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="160" height="160" fill="#2a7a72"/>

  <!-- Horizontal strip -->
  <rect y="96" width="160" height="56" fill="#0c3a3a" fill-opacity="0.5"/>
  <rect y="96" width="160" height="1" fill="#fff" fill-opacity="0.35"/>
  <rect y="100" width="160" height="8" fill="url(#holesH)"/>
  <rect y="140" width="160" height="8" fill="url(#holesH)"/>
  <rect x="4" y="111" width="72" height="26" rx="2" fill="url(#frameH)"/>
  <rect x="84" y="111" width="72" height="26" rx="2" fill="url(#frameH)"/>

  <!-- Vertical strip, woven over the horizontal one -->
  <rect x="16" width="56" height="160" fill="#0c3a3a" fill-opacity="0.55"/>
  <rect x="16" width="1" height="160" fill="#fff" fill-opacity="0.35"/>
  <rect x="20" width="8" height="160" fill="url(#holesV)"/>
  <rect x="60" width="8" height="160" fill="url(#holesV)"/>
  <rect x="31" y="4" width="26" height="72" rx="2" fill="url(#frameV)"/>
  <rect x="31" y="84" width="26" height="72" rx="2" fill="url(#frameV)"/>
</svg>
